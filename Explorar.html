<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/684/684908.png">
    <title>Explorar — Turismo na Grande Vitória</title>
    <style>
        /* === Estilos exclusivos da página Explorar === */

        .explorar-hero {
            max-width: 900px;
            margin: 32px auto 0;
            padding: 28px 24px 20px;
            background: var(--white);
            border-radius: 18px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .explorar-hero h1 {
            margin: 0 0 6px;
            color: var(--primary-dark);
            font-size: 1.8rem;
        }
        .explorar-hero p {
            margin: 0 0 20px;
            color: #555;
            font-size: 1rem;
        }

        /* Filtros de cidade */
        .city-filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .city-btn {
            background: var(--primary-dark);
            color: var(--white);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .city-btn:hover {
            background: var(--accent);
            color: var(--primary-dark);
        }
        .city-btn.active {
            background: var(--accent);
            color: var(--primary-dark);
            font-weight: bold;
            transform: translateY(-1px);
        }

        /* Layout de duas colunas */
        .explorar-grid {
            max-width: 900px;
            margin: 24px auto 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 700px) {
            .explorar-grid { grid-template-columns: 1fr; margin: 16px 3vw 32px; }
        }

        .explorar-col {
            background: var(--white);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 20px 18px;
            min-height: 200px;
        }
        .explorar-col h2 {
            font-size: 1.1rem;
            margin: 0 0 14px;
            color: var(--primary-dark);
            text-align: left;
            letter-spacing: 0;
        }
        .explorar-col h2 span {
            font-weight: 400;
            color: #777;
            font-size: 0.9rem;
        }

        /* Cards de item dentro do explorar */
        .explorar-item {
            background: #e0f2f1;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .explorar-item:hover {
            background: #c5e8e4;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .explorar-item.is-active {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 2px 12px rgba(0,105,92,0.3);
        }
        .explorar-item.is-active .item-city-tag,
        .explorar-item.is-active .item-desc {
            color: rgba(255,255,255,0.8);
        }
        .explorar-item strong {
            font-size: 0.95rem;
            font-weight: 600;
            display: block;
        }
        .item-city-tag {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 500;
        }
        .item-desc {
            font-size: 0.8rem;
            color: #666;
            font-weight: 400;
        }
        .item-link-row {
            display: flex;
            gap: 6px;
            margin-top: 2px;
            flex-wrap: wrap;
        }
        .item-link-row a {
            font-size: 0.75rem;
            background: var(--primary-dark);
            color: var(--white);
            padding: 3px 10px;
            border-radius: 12px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .item-link-row a:hover {
            background: var(--accent);
            color: var(--primary-dark);
        }
        .explorar-item.is-active .item-link-row a {
            background: rgba(255,255,255,0.25);
            color: var(--white);
        }
        .explorar-item.is-active .item-link-row a:hover {
            background: rgba(255,255,255,0.45);
        }

        /* Painel "próximos" (lado restaurantes quando um ponto é selecionado) */
        .nearby-header {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #d5ecea;
        }
        .nearby-source {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #f0faf9;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        /* Estado vazio */
        .empty-state {
            text-align: center;
            color: #999;
            padding: 32px 16px;
            font-size: 0.9rem;
        }
        .empty-state .empty-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }

        /* Contagem de resultados */
        .result-count {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 12px;
        }

        /* Dark mode */
        body.dark-mode .explorar-hero { background: var(--white); }
        body.dark-mode .explorar-hero p { color: #aaa; }
        body.dark-mode .explorar-col { background: var(--white); }
        body.dark-mode .explorar-item { background: #1d3a37; color: #d9f6f2; }
        body.dark-mode .explorar-item:hover { background: #224743; }
        body.dark-mode .explorar-item.is-active { background: var(--primary); color: #0d2d28; }
        body.dark-mode .explorar-item.is-active .item-city-tag,
        body.dark-mode .explorar-item.is-active .item-desc { color: rgba(13,45,40,0.75); }
        body.dark-mode .item-city-tag { color: var(--accent); }
        body.dark-mode .item-desc { color: #90b8b4; }
        body.dark-mode .nearby-source { background: #1a3330; border-color: var(--accent); color: #b0d8d4; }
        body.dark-mode .nearby-header { color: var(--accent); border-color: #2a4f4a; }
        body.dark-mode .result-count { color: #6a9a96; }
        body.dark-mode .explorar-item.is-active .item-link-row a { background: rgba(0,0,0,0.2); color: #0d2d28; }
    </style>
</head>

    // Restaurantes — cidade inferida dos agrupamentos do OndeComer.html
    // Nota: links curtos do Maps não têm coordenadas extraíveis.
    // Quando você corrigir o OndeComer com embed URLs, adicione lat/lng aqui.

    // =============================================
    // LÓGICA DA PÁGINA
    // =============================================

    let activeCity = 'todas';
    let activeSpotId = null;

    // Calcula distância em km entre duas coordenadas (fórmula de Haversine)
    function distKm(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function openMapModal(embedUrl, name, mapsUrl) {
        const overlay = document.querySelector('.map-modal-overlay');
        const iframe  = overlay?.querySelector('iframe');
        const titleEl = document.querySelector('#map-modal-title');
        const gmBtn   = overlay?.querySelector('.map-button');
        if (!overlay || !iframe) return;
        iframe.src = embedUrl;
        if (titleEl) titleEl.textContent = 'Mapa: ' + name;
        if (gmBtn) {
            if (mapsUrl) { gmBtn.style.display = 'block'; gmBtn.href = mapsUrl; }
            else gmBtn.style.display = 'none';
        }
        overlay.classList.add('is-visible');
    }

    function buildSpotCard(spot, isActive) {
        const div = document.createElement('div');
        div.className = 'explorar-item' + (isActive ? ' is-active' : '');
        div.dataset.id = spot.id;

        let html = `<strong>${spot.name}</strong>
                    <span class="item-city-tag">📍 ${spot.cityLabel}</span>`;
        if (spot.desc) html += `<span class="item-desc">${spot.desc}</span>`;
        html += `<div class="item-link-row">`;
        if (spot.embedUrl) html += `<a href="${spot.mapsUrl}" class="spot-map-link" data-embed="${spot.embedUrl}" data-name="${spot.name}" data-maps="${spot.mapsUrl}">Ver no mapa</a>`;
        html += `</div>`;
        div.innerHTML = html;

        // Clique no card = selecionar ponto e mostrar próximos
        div.addEventListener('click', (e) => {
            if (e.target.closest('a')) return; // deixa o link funcionar normalmente
            activeSpotId = (activeSpotId === spot.id) ? null : spot.id;
            renderAll();
        });

        // Clique no link "Ver no mapa"
        div.querySelector('.spot-map-link')?.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openMapModal(spot.embedUrl, spot.name, spot.mapsUrl);
        });

        return div;
    }

    function buildRestaurantCard(restaurant, distLabel) {
        const div = document.createElement('div');
        div.className = 'explorar-item';
        div.dataset.id = restaurant.id;

        let html = `<strong>${restaurant.name}</strong>
                    <span class="item-city-tag">📍 ${restaurant.cityLabel}${distLabel ? ' · ' + distLabel : ''}</span>
                    <div class="item-link-row">
                        <a href="${restaurant.mapsUrl}" target="_blank" rel="noopener noreferrer">Ver no mapa</a>
                    </div>`;
        div.innerHTML = html;
        return div;
    }

    function renderAll() {
        const spotsList  = document.getElementById('spots-list');
        const restList   = document.getElementById('restaurants-list');
        const nearbyArea = document.getElementById('nearby-header-area');
        const spotsCount = document.getElementById('spots-result-count');
        const restCount  = document.getElementById('restaurants-result-count');
        const restColTitle = document.querySelector('#restaurants-col h2');

        // Filtra por cidade
        const filteredSpots = SPOTS.filter(s => activeCity === 'todas' || s.city === activeCity);
        const filteredRests = RESTAURANTS.filter(r => activeCity === 'todas' || r.city === activeCity);

        // Renderiza pontos turísticos
        spotsList.innerHTML = '';
        if (filteredSpots.length === 0) {
            spotsList.innerHTML = '<div class="empty-state"><span class="empty-icon">🌎</span>Nenhum ponto turístico nesta cidade ainda.</div>';
        } else {
            filteredSpots.forEach(spot => {
                spotsList.appendChild(buildSpotCard(spot, spot.id === activeSpotId));
            });
        }
        spotsCount.textContent = filteredSpots.length > 0 ? `${filteredSpots.length} ${filteredSpots.length === 1 ? 'local' : 'locais'}` : '';

        // Renderiza restaurantes — com ou sem ponto selecionado
        restList.innerHTML = '';
        nearbyArea.innerHTML = '';

        const activeSpot = SPOTS.find(s => s.id === activeSpotId);

        if (activeSpot) {
            // Modo "próximos": filtra restaurantes pela mesma cidade do ponto selecionado
            restColTitle.innerHTML = '🍽️ Restaurantes <span>por perto</span>';

            nearbyArea.innerHTML = `
                <div class="nearby-header">Próximos a:</div>
                <div class="nearby-source">${activeSpot.name} — ${activeSpot.cityLabel}</div>`;

            // Restaurantes da mesma cidade, ordenados por distância se tiver coords
            let nearbyRests = RESTAURANTS.filter(r => r.city === activeSpot.city);

            if (activeSpot.lat && nearbyRests.some(r => r.lat)) {
                nearbyRests = nearbyRests
                    .map(r => ({ ...r, dist: r.lat ? distKm(activeSpot.lat, activeSpot.lng, r.lat, r.lng) : null }))
                    .sort((a, b) => (a.dist ?? 999) - (b.dist ?? 999));
            }

            if (nearbyRests.length === 0) {
                restList.innerHTML = `<div class="empty-state"><span class="empty-icon">🍽️</span>Nenhum restaurante cadastrado em ${activeSpot.cityLabel} ainda.</div>`;
            } else {
                nearbyRests.forEach(r => {
                    const distLabel = r.dist ? `~${r.dist.toFixed(1)} km` : null;
                    restList.appendChild(buildRestaurantCard(r, distLabel));
                });
            }
            restCount.textContent = nearbyRests.length > 0 ? `${nearbyRests.length} encontrados` : '';
        } else {
            // Modo normal: mostra restaurantes filtrados por cidade
            restColTitle.innerHTML = '🍽️ Restaurantes <span id="restaurants-count"></span>';

            if (filteredRests.length === 0) {
                restList.innerHTML = '<div class="empty-state"><span class="empty-icon">🍽️</span>Nenhum restaurante nesta cidade ainda.</div>';
            } else {
                filteredRests.forEach(r => restList.appendChild(buildRestaurantCard(r, null)));
            }
            restCount.textContent = filteredRests.length > 0 ? `${filteredRests.length} restaurantes` : '';
        }
    }

    // Filtros de cidade
    document.querySelectorAll('.city-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCity = btn.dataset.city;
            activeSpotId = null; // reseta seleção ao trocar cidade
            renderAll();
        });
    });

    // Modal: fechar
    const overlay = document.querySelector('.map-modal-overlay');
    const closeBtn = document.querySelector('.map-close-btn');
    if (closeBtn) closeBtn.addEventListener('click', () => overlay.classList.remove('is-visible'));
    overlay?.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('is-visible'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay?.classList.remove('is-visible'); });

    // Inicia
    renderAll();
    </script>
